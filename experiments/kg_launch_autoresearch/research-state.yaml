outer_loop:
  cycle: 4
  last_direction: "H6 held-fixed transaction-time snapshot ranking consequence"
  last_reflection: "H6 Phase A passed decisively and reproducibly without opening labels: 87.57 percent of score vectors, 55.00 percent of total orders, and 21.55 percent of Top-10 sets changed. Phase B is now permitted but must be hash-locked and committed before its one confirmatory label-opening run. In parallel, H7 has a draft label-blind protocol for an exact fixed-point revision-chain certificate; it is not yet locked or executed."

