  gate:
    status: cycle4_phase3_complete_prospective_source_frozen
    rule: "FACET-PREF is promising only if the source-bound external verifier recomputes every preregistered G1-G9 gate as true; any failure kills the method and forbids Phase 5."

outer_loop:
  cycle: 4
  last_direction: "FACET_PREF_SELECTED_AFTER_REJECTING_DEEP_TAIL_CONTINUATION"
  last_reflection: "RAVEL's failure came from a sparse preference-relevant action set. A read-only continuation probe initially showed +0.0053 on broad tail pairs, but served-page diagnostics were null or negative, so head-exact continuation was rejected before a new PoC. Cycle 4 instead tests macro-balanced alignment of facet-conditioned queries before fixed-budget ANN retrieval, while retaining the immutable BPR branch."

