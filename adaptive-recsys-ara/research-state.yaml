# Research State — Adaptive Recommendation Research Sprint

project:
  title: "CABLE-PREF: Cardinality-Assured Boundary Learning for Preference-aligned retrieval"
  question: "On unopened MovieLens 10M, can endpoint-leave-out admission-boundary alignment improve preferred admission by +0.020 over raw exact-complement retrieval and +0.010 over order-only alignment, and sPCE@10 by +0.005 over raw hybrid and BPR, under an exact 200+200 output contract without relevance or p95 regression?"
  status: active
  phase: 4_poc_validation_cycle_5_authorized_once_not_yet_launched
  started: "2026-08-07"
  domain: "vector retrieval and preference-aligned recommendation"

literature:
  key_papers:
    - "Sentence-BERT (EMNLP-IJCNLP 2019)"
    - "FAISS (2017) and ScaNN (ICML 2020)"
    - "Stochastic Retrieval-Conditioned Reranking (ICTIR 2022)"
    - "TIGER (NeurIPS 2023)"
    - "SimPO (NeurIPS 2024)"
    - "Preference Learning Algorithms Do Not Learn Preference Rankings (NeurIPS 2024)"
    - "RecPO (ACL 2026)"
    - "Recommendations as Treatments (ICML 2016)"
    - "Quake (OSDI 2025)"
    - "Drift-Adapter (EMNLP 2025)"
    - "SelectiveNet (ICML 2019)"
    - "Learning to Defer to a Set of Experts (ICML 2025)"
    - "Recommendation Systems with Distribution-Free Reliability Guarantees (UAI 2023)"
    - "Selective LLM-Guided Regularization (WSDM GenAIRecP 2026)"
  open_problems:
    - "ANN geometric objectives are disconnected from aligned downstream utility."
    - "Implicit feedback is censored by exposure and position."
    - "Fresh preference updates conflict with catalog re-embedding and index rebuild cost."
    - "Semantic/LLM alignment remains expensive at online inference time."
    - "Pairwise preference quality does not identify which list interventions are safe or useful."
    - "Global fusion assumes complementary experts help on the same requests."
    - "Temporal validation does not inherit conformal or distribution-free guarantees."
    - "Post-training residual selection with exact identity fallback is under-explored relative to joint gates."
    - "Single-centroid semantic queries erase multi-modal user preference geometry."
    - "Positive-item candidate recall does not reveal natural preference-pair co-support."
    - "Post-filter fixed-depth ANN cannot guarantee an exact unseen-candidate budget for long user histories."
    - "Pairwise preference margins do not directly train a preferred item to cross the deployed eligible branch-admission cutoff."
    - "Independent retrieval branches waste fixed candidate slots through overlap unless complement ownership is enforced at selection time."
  evidence_gaps:
    - "The RAVEL component intersection is only a candidate whitespace, not an exhaustive novelty proof."
    - "PoC evidence is required before any benefit claim."

hypotheses:
  - id: C2-H1
    status: falsified
    statement: "CAPER improves NDCG@10 over strong BPR and every matched residual/fusion ablation."
  - id: C2-H2
    status: falsified
    statement: "CAPER improves held-out explicit preference-pair accuracy by at least three percentage points over BPR."
  - id: C2-H3
    status: supported
    statement: "The collaborative candidate set is a subset of the served union for every request."
  - id: C2-H4
    status: supported
    statement: "Hard collaborative-regret projection prevents material Recall@10 loss and excessive dislike intrusion."
  - id: C2-H5
    status: supported
    statement: "Two immutable FAISS searches plus residual projection stay within the matched hybrid p95 budget."
  - id: C3-H1
    status: falsified
    statement: "RAVEL improves user-macro explicit preference-pair accuracy by at least 0.005 over the frozen linear hybrid while meeting the locked NDCG@10 non-inferiority bounds."
  - id: C3-H2
    status: provisional_runner_support_but_external_integrity_failed
    statement: "RAVEL's exact-fallback selector outperforms always-on residual alignment in NDCG and matched-coverage heuristic routing in preference accuracy."
  - id: C4-H1
    status: not_evaluated_project_killed_on_feasibility
    statement: "FACET-PREF improves natural preference-pair candidate co-support by at least 0.02 over the fixed-budget single-centroid hybrid with a paired lower bound above zero."
  - id: C4-H2
    status: not_evaluated_project_killed_on_feasibility
    statement: "FACET-PREF improves strict preference-consistent exposure@10 by at least 0.005 over both the single-centroid hybrid and selected BPR with paired lower bounds above zero."
  - id: C4-H3
    status: not_evaluated_project_killed_on_feasibility
    statement: "FACET-PREF is non-inferior to the single-centroid hybrid in NDCG@10 and satisfies the 1.25x p95 latency budget."
  - id: C4-F1
    status: falsified
    statement: "A fixed depth-700 BPR search always contains at least 200 prefix-unseen candidates for every eligible FACET-PREF request."
  - id: C5-H1
    status: preregistered_unopened
    statement: "CABLE-PREF materially improves method-independent BPR-missed preferred-item admission over raw exact-complement retrieval and order-only reference-free alignment."
  - id: C5-H2
    status: preregistered_unopened
    statement: "CABLE-PREF improves strict preference-consistent exposure@10 over raw hybrid and BPR while remaining relevance- and dislike-safe."
  - id: C5-H3
    status: preregistered_unopened
    statement: "Exact complement retrieval guarantees every eligible 200+200 output, and CABLE-PREF stays within the registered matched p95 budget without changing immutable item geometry."

