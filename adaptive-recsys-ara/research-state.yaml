# Research State — Adaptive Recommendation Research Sprint

project:
  title: "RAVEL: Residual Alignment via a Validation-gated Exception Layer"
  question: "Can post-training, validation-gated application of a reference-free preference residual improve explicit preference accuracy while remaining non-inferior in temporal NDCG@10 to a frozen linear semantic-collaborative vector ranker?"
  status: active
  phase: 4_poc_validation_cycle_3_preregistered
  started: "2026-08-07"
  domain: "vector retrieval and preference-aligned recommendation"

literature:
  key_papers:
    - "Sentence-BERT (EMNLP-IJCNLP 2019)"
    - "FAISS (2017) and ScaNN (ICML 2020)"
    - "Stochastic Retrieval-Conditioned Reranking (ICTIR 2022)"
    - "TIGER (NeurIPS 2023)"
    - "SimPO (NeurIPS 2024)"
    - "Preference Learning Algorithms Do Not Learn Preference Rankings (NeurIPS 2024)"
    - "RecPO (ACL 2026)"
    - "Recommendations as Treatments (ICML 2016)"
    - "Quake (OSDI 2025)"
    - "Drift-Adapter (EMNLP 2025)"
    - "SelectiveNet (ICML 2019)"
    - "Learning to Defer to a Set of Experts (ICML 2025)"
    - "Recommendation Systems with Distribution-Free Reliability Guarantees (UAI 2023)"
    - "Selective LLM-Guided Regularization (WSDM GenAIRecP 2026)"
  open_problems:
    - "ANN geometric objectives are disconnected from aligned downstream utility."
    - "Implicit feedback is censored by exposure and position."
    - "Fresh preference updates conflict with catalog re-embedding and index rebuild cost."
    - "Semantic/LLM alignment remains expensive at online inference time."
    - "Pairwise preference quality does not identify which list interventions are safe or useful."
    - "Global fusion assumes complementary experts help on the same requests."
    - "Temporal validation does not inherit conformal or distribution-free guarantees."
    - "Post-training residual selection with exact identity fallback is under-explored relative to joint gates."
  evidence_gaps:
    - "The RAVEL component intersection is only a candidate whitespace, not an exhaustive novelty proof."
    - "PoC evidence is required before any benefit claim."

hypotheses:
  - id: C2-H1
    status: falsified
    statement: "CAPER improves NDCG@10 over strong BPR and every matched residual/fusion ablation."
  - id: C2-H2
    status: falsified
    statement: "CAPER improves held-out explicit preference-pair accuracy by at least three percentage points over BPR."
  - id: C2-H3
    status: supported
    statement: "The collaborative candidate set is a subset of the served union for every request."
  - id: C2-H4
    status: supported
    statement: "Hard collaborative-regret projection prevents material Recall@10 loss and excessive dislike intrusion."
  - id: C2-H5
    status: supported
    statement: "Two immutable FAISS searches plus residual projection stay within the matched hybrid p95 budget."
  - id: C3-H1
    status: pending
    statement: "RAVEL improves user-macro explicit preference-pair accuracy by at least 0.005 over the frozen linear hybrid while meeting the locked NDCG@10 non-inferiority bounds."
  - id: C3-H2
    status: pending
    statement: "RAVEL's exact-fallback selector outperforms always-on residual alignment in NDCG and matched-coverage heuristic routing in preference accuracy."

