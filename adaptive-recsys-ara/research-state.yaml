      proposed_ndcg_at_10: 0.011350290536784564
      bpr_ndcg_at_10: 0.06255894164014639
      gate_passed: false
    - design: "CAPER v1"
      status: dead_end
      proposed_ndcg_at_10: 0.06319149679753816
      bpr_ndcg_at_10: 0.06311244084043514
