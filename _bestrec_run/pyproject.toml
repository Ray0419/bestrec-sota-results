[project]
name = "bestrec-run"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "scikit-learn",
    "tqdm",
    "sentence-transformers",
    "matplotlib>=3.10.9",
    "pdfplumber>=0.11.9",
    "reportlab>=4.5.0",
    "datasets>=4.8.5",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "wget>=3.2",
    "wandb>=0.27.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
