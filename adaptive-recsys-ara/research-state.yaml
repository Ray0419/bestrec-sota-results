outer_loop:
  cycle: 3
  last_direction: "RAVEL_v1_PREREGISTERED_AND_AUDITED"
  last_reflection: "The successor is a post-training one-sided exception layer: preserve projected linear fusion exactly on rejection, retain its nonselected tail even on acceptance, and serve the same finite proposal only when temporally prior validation predicts benefit under bounded relevance risk. The external verifier independently replays selection and G1-G10."

