outer_loop:
  cycle: 5
  last_direction: "H6 confirmatory outcome adjudication; pivot to H9 provenance-Rayleigh certificate"
  last_reflection: "H6 Phase B was valid and statistically resolved but failed both the prospective practical-magnitude and matched-null attribution gates: current-minus-historical nDCG@10 was -0.0023677 versus a required absolute 0.005, and the matched-null q95 was 0.0027244. H6 and its contingent H7A lead path are killed without rescue tuning. H9 now tests, label-blind, whether a globally propagated regularized-Laplacian scorer can be both revision-sensitive and deterministically certifiable using exact small Schur complements."

