# Research State — Adaptive Recommendation Research Sprint

project:
  title: "Cycle 3: Selective Preference Alignment over a Linear Hybrid"
  question: "Can a validation-calibrated selective preference correction improve explicit alignment while retaining the relevance gain, safety, and latency of a strong linear semantic-collaborative hybrid?"
  status: active
  phase: 1_identify_limitations_cycle_3
  started: "2026-08-07"
  domain: "vector retrieval and preference-aligned recommendation"

literature:
  key_papers:
    - "Sentence-BERT (EMNLP-IJCNLP 2019)"
    - "FAISS (2017) and ScaNN (ICML 2020)"
    - "Stochastic Retrieval-Conditioned Reranking (ICTIR 2022)"
    - "TIGER (NeurIPS 2023)"
    - "SimPO (NeurIPS 2024)"
    - "Preference Learning Algorithms Do Not Learn Preference Rankings (NeurIPS 2024)"
    - "RecPO (ACL 2026)"
    - "Recommendations as Treatments (ICML 2016)"
    - "Quake (OSDI 2025)"
    - "Drift-Adapter (EMNLP 2025)"
  open_problems:
    - "ANN geometric objectives are disconnected from aligned downstream utility."
    - "Implicit feedback is censored by exposure and position."
    - "Fresh preference updates conflict with catalog re-embedding and index rebuild cost."
    - "Semantic/LLM alignment remains expensive at online inference time."
    - "Preference residuals lack a hard strong-baseline regret floor on the actual served candidate union."
  evidence_gaps:
    - "No exhaustive novelty proof exists for the full RIPPLE component intersection."
    - "PoC evidence is required before any benefit claim."

hypotheses:
  - id: C2-H1
    status: falsified
    statement: "CAPER improves NDCG@10 over strong BPR and every matched residual/fusion ablation."
  - id: C2-H2
    status: falsified
    statement: "CAPER improves held-out explicit preference-pair accuracy by at least three percentage points over BPR."
  - id: C2-H3
    status: supported
    statement: "The collaborative candidate set is a subset of the served union for every request."
  - id: C2-H4
    status: supported
    statement: "Hard collaborative-regret projection prevents material Recall@10 loss and excessive dislike intrusion."
  - id: C2-H5
    status: supported
    statement: "Two immutable FAISS searches plus residual projection stay within the matched hybrid p95 budget."
  - id: C3-H1
    status: pending
    statement: "A validation-calibrated selective uniform-pair correction can improve preference accuracy while retaining the projected linear hybrid's relevance."

experiments:
  proxy_metric: "Temporal full-catalog NDCG@10"
  baseline_value: 0.005728564774466464
  best_value: 0.0648460502012084
  total_runs: 2
  trajectory:
    - design: "RIPPLE v1"
      status: dead_end
      proposed_ndcg_at_10: 0.011350290536784564
      bpr_ndcg_at_10: 0.06255894164014639
      gate_passed: false
    - design: "CAPER v1"
      status: dead_end
      proposed_ndcg_at_10: 0.06319149679753816
      bpr_ndcg_at_10: 0.06311244084043514
      strongest_control_ndcg_at_10: 0.0648460502012084
      gate_passed: false
  gate:
    status: cycle3_not_reached
    rule: "A new cycle-3 gate must be locked on a disjoint cohort before any successor outcome is evaluated."

outer_loop:
  cycle: 3
  last_direction: "CAPER_v1_DEAD_END"
  last_reflection: "Support and hard regret constraints preserved safety and latency, but contradiction-focused global residuals did not improve preference accuracy and lost to simple projected linear fusion. Preserve linear fusion as the relevance anchor; test selective, uniformly trained preference corrections on a disjoint cohort."

